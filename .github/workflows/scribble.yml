name: Build and Deploy Pollen Site

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Racket
        uses: Bogdanp/setup-racket@v1.11
        with:
          version: '8.17'

      - name: Install Pollen
        run: raco pkg install --auto --no-docs pollen

      - name: Build Site
        run: |
          cd docs
          raco pollen render
          mkdir -p ../_site
          cp *.html ../_site/
          cp *.css *.png *.svg ../_site/ 2>/dev/null || true
          cp -r slides ../_site/ 2>/dev/null || true
          # Notes: html + any image/video assets dropped alongside entries
          mkdir -p ../_site/notes
          cp notes/*.html ../_site/notes/ 2>/dev/null || true
          find notes -mindepth 1 -type f \
            \( -name '*.jpg' -o -name '*.jpeg' -o -name '*.png' \
            -o -name '*.gif' -o -name '*.webp' -o -name '*.svg' \
            -o -name '*.mp4' -o -name '*.webm' \) \
            -exec cp --parents {} ../_site/ \; 2>/dev/null || true
          cp ../CNAME ../_site/

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
